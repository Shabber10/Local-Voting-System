services:
  - type: web
    name: votesphere
    runtime: python
    region: oregon
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_ROTATION_SECONDS
        value: 20
      - key: SESSION_DURATION_SECONDS
        value: 3600
